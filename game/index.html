<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Palms — Palmera Bay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07070f; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    width: 100vw; height: 100vh; object-fit: contain; display: block;
    background: #0d1020; touch-action: none; cursor: crosshair;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Palms: an open-world crime game in the city of Palmera Bay. Walk and drive with WASD, press E to enter a car, aim with the mouse."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
